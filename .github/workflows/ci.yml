name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Next's generated route validators live in .next/types and only exist after
      # typegen. Without this, `bun run typecheck` runs against a program that excludes
      # them and silently skips page/layout/route-handler prop validation.
      - name: Generate route types
        run: bun run typegen

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun run test

      # Prerendering /_not-found constructs a Supabase client, which throws without a
      # URL and key, so the build cannot complete on credentials alone being absent.
      # These are syntactically valid placeholders, never contacted: the build only
      # needs the client to construct. Replaced when Supabase is removed in P6.
      - name: Build
        run: bun run build
